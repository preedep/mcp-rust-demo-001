[package]
name = "mcp-rust-demo-001"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[dependencies]
actix-web = "4.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
chrono = "0.4"
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
futures-core = "0.3"
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = false
